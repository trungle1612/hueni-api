production:
  sync_calendar_feeds:
    class: SyncCalendarFeedsJob
    schedule: every hour
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  end_maintenance:
    command: "Room.end_maintenance"
    schedule: every day at 0:05 Asia/Ho_Chi_Minh
  prune_sync_runs:
    command: "SyncRun.prune"
    schedule: every day at 3am
