# Deployed by .github/workflows/deploy.yml on every green push to main.
# The VPS address and SSH user stay out of this public repo: DEPLOY_HOST / DEPLOY_USER come from the environment.
service: hueni_api

image: trungle1612/hueni-api

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "deploy") %>

# nginx on the VPS owns 80/443 (hueni.me) and terminates TLS for api.hueni.me,
# then proxies to kamal-proxy on 127.0.0.1:8080. Kamal must never publish 80/443.
proxy:
  host: api.hueni.me
  app_port: 80
  ssl: false
  forward_headers: true # keep nginx's X-Forwarded-For / -Proto (real client IP for rate limits, https for force_ssl)
  healthcheck:
    path: /up
  run:
    http_port: 8080
    https_port: 8443
    bind_ips:
      - 127.0.0.1

registry:
  server: ghcr.io
  username: trungle1612
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - ZALO_APP_ID
    - ZALO_APP_SECRET
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHAT_ID
  clear:
    # Solid Queue (hourly iCal sync) runs inside Puma: one small server.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# SQLite lives on the host (created in #8), backed up by the litestream accessory below.
volumes:
  - "/var/lib/hueni-api/storage:/rails/storage"

# `kamal deploy` does not touch accessories. First time: bin/kamal accessory boot litestream;
# after changing config/litestream.yml or its secrets: bin/kamal accessory reboot litestream.
accessories:
  litestream:
    image: litestream/litestream:0.3.13
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: replicate
    files:
      - config/litestream.yml:/etc/litestream.yml
    volumes:
      - "/var/lib/hueni-api/storage:/data"
    env:
      secret:
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_SECRET_ACCESS_KEY
        - LITESTREAM_R2_ENDPOINT

asset_path: /rails/public/assets

builder:
  arch: amd64
